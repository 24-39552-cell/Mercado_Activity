<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Call of Duty: Mobile - Player Authentication Portal">
  <title>Call of Duty: Mobile - Account Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Roboto:wght@400;500;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --cod-dark: #0f1215;
      --cod-card-bg: rgba(24, 29, 34, 0.85);
      --cod-gold: #f3a812;
      --cod-gold-hover: #d99208;
      --cod-gray: #a0aab2;
      --cod-border: rgba(243, 168, 18, 0.4);
      --cod-input-bg: rgba(15, 18, 21, 0.7);
      --cod-error: #ff4d4d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      color: #e1e6eb;
      background: linear-gradient(180deg, rgba(15, 18, 21, 0.75) 0%, rgba(15, 18, 21, 0.9) 100%),
                  url('https://codm.garena.com/static/images/Main-page/P1/main-kv.jpg') center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 15px; 
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      margin: auto; 
      background: var(--cod-card-bg);
      border: 1px solid var(--cod-border);
      border-radius: 8px;
      padding: 30px 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(243, 168, 18, 0.15);
      text-align: center;
    }

    @supports (backdrop-filter: blur(12px)) or (-webkit-backdrop-filter: blur(12px)) {
      .auth-container {
        background: rgba(24, 29, 34, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
    }

    .brand-header { margin-bottom: 20px; }
    .brand-logo-svg { width: 46px; height: 46px; display: inline-block; margin-bottom: 4px; }
    .brand-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(1.4rem, 5vw, 1.8rem); 
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .brand-subtitle {
      font-family: 'Teko', sans-serif;
      color: var(--cod-gold);
      font-size: clamp(1rem, 4vw, 1.2rem);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .form-heading {
      font-family: 'Teko', sans-serif;
      font-size: clamp(1.8rem, 6vw, 2.2rem);
      letter-spacing: 1px;
      color: #fff;
      margin-bottom: 16px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--cod-gold);
      display: inline-block;
      padding-bottom: 2px;
    }

    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--cod-gray);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .input-field { position: relative; display: flex; align-items: center; }
    .input-field i { position: absolute; left: 12px; color: var(--cod-gold); }
    .input-field input {
      width: 100%;
      padding: 12px 12px 12px 38px; 
      background: var(--cod-input-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .input-field input:focus {
      border-color: var(--cod-gold);
      box-shadow: 0 0 8px rgba(243, 168, 18, 0.4);
    }

    /* Error Message Box for Auth Failure */
    .auth-error-box {
      display: none;
      background: rgba(255, 77, 77, 0.15);
      border: 1px solid var(--cod-error);
      color: var(--cod-error);
      padding: 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      text-align: left;
      line-height: 1.4;
    }

    label.error {
      color: var(--cod-error) !important;
      font-size: 0.78rem;
      margin-top: 5px;
      display: block;
      text-transform: none !important;
    }

    input.error { border-color: var(--cod-error) !important; }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .remember-me { display: flex; align-items: center; gap: 6px; color: var(--cod-gray); }
    .remember-me input { accent-color: var(--cod-gold); }
    .forgot-link { color: var(--cod-gold); text-decoration: none; }

    .btn-cod-submit {
      width: 100%;
      background-color: var(--cod-gold);
      color: #000;
      font-family: 'Teko', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      text-transform: uppercase;
      border: none;
      padding: 10px 0;
      cursor: pointer;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    .btn-cod-submit:hover { background-color: var(--cod-gold-hover); }

    .btn-cod-submit:disabled {
      background-color: #555555 !important;
      color: #888888 !important;
      cursor: not-allowed;
    }

    .switch-link-text { margin-top: 18px; font-size: 0.88rem; color: var(--cod-gray); }
    .switch-btn { color: var(--cod-gold); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>

  <main class="auth-container">
    <header class="brand-header">
      <svg class="brand-logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 2Z" fill="#F3A812"/>
        <path d="M12 6L15 11H9L12 6Z" fill="#0F1215"/>
      </svg>
      <h1 class="brand-title">Call of Duty</h1>
      <span class="brand-subtitle">Mobile-Garena</span>
    </header>

    <div class="form-wrapper">
      <form class="login-form" id="loginForm" action="#" method="POST" novalidate>
        <h2 class="form-heading">Login to Your Account</h2>

        <div id="authError" class="auth-error-box"></div>

        <div class="input-group">
          <label for="login-username">Username or Email</label>
          <div class="input-field">
            <i class="bi bi-person-fill"></i>
            <input type="text" id="login-username" name="username" placeholder="Enter username / email">
          </div>
        </div>

        <div class="input-group">
          <label for="login-password">Password</label>
          <div class="input-field">
            <i class="bi bi-lock-fill"></i>
            <input type="password" id="login-password" name="password" placeholder="Enter password">
          </div>
        </div>

        <div class="form-actions">
          <label class="remember-me" for="remember-me">
            <input type="checkbox" id="remember-me" name="remember">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" id="submitBtn" class="btn-cod-submit">Login</button>

        <p class="switch-link-text">
          Don't have an account? 
          <a href="register.html" class="switch-btn">Register</a>
        </p>
      </form>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

  <script>
    $(document).ready(function() {
      // LOGIN 
      const STATIC_USER = "Player";
      const STATIC_PASS = "Player@12345";

      let failedAttempts = 0;
      let lockoutTimer = null;

      $("#loginForm").validate({
        rules: {
          username: { required: true },
          password: { required: true }
        },
        messages: {
          username: { required: "Please enter your username or email." },
          password: { required: "Please enter your password." }
        },
        errorPlacement: function(error, element) {
          error.insertAfter(element.closest('.input-field'));
        },
        submitHandler: function(form) {
          if (failedAttempts >= 5) {
            return false; 
          }

          const inputUser = $("#login-username").val().trim();
          const inputPass = $("#login-password").val();
          const registeredUser = JSON.parse(localStorage.getItem('registeredUser'));

          let isAuthenticated = false;
          let displayName = "";

          if (inputUser === STATIC_USER && inputPass === STATIC_PASS) {
            isAuthenticated = true;
            displayName = STATIC_USER;
          } else if (registeredUser && (inputUser === registeredUser.username || inputUser === registeredUser.email) && inputPass === registeredUser.password) {
            isAuthenticated = true;
            displayName = registeredUser.username;
          }

          if (isAuthenticated) {
            failedAttempts = 0;
            localStorage.setItem("currentUser", displayName);
            window.location.href = "index.html"; 
          } else {
            failedAttempts++;

            if (failedAttempts >= 5) {
              startLockoutTimer();
            } else {
              $("#authError").text("Login Failed. The username or password you entered is incorrect. Please check your credentials and try again.").show();
            }
          }
        }
      });

      function startLockoutTimer() {
        let secondsLeft = 15;

        $("#login-username, #login-password, #submitBtn").prop("disabled", true);

        function updateLockoutText() {
          $("#authError").text("You have reached the maximum of 5 failed login attempts. Please wait " + secondsLeft + " seconds before trying to log in again.").show();
        }

        updateLockoutText();

        lockoutTimer = setInterval(function() {
          secondsLeft--;
          if (secondsLeft > 0) {
            updateLockoutText();
          } else {
            clearInterval(lockoutTimer);
            failedAttempts = 0; 
            $("#login-username, #login-password, #submitBtn").prop("disabled", false);
            $("#authError").hide().text("");
          }
        }, 1000);
      }
    });
  </script>
</body>
</html>
